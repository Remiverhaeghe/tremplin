<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Sous-chemin de GitHub Pages, remplacé par flutter build web --base-href -->

  <script>

      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
